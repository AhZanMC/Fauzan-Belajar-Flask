<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Admin Panel Fauzan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <script src="{{ url_for('static', filename='js/toastNotif.js') }}" defer></script>

    <!-- Icon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.ico') }}">
</head>

<body class="bg-slate-50 font-sans antialiased text-slate-800 min-h-screen flex items-center justify-center p-4">

    <!-- ================================================================= -->
    <!-- Container Card -->
    <!-- ================================================================= -->
    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-sm p-8">

        <!-- +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++ -->
        <!-- Header Logo & Title -->
        <!-- +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++ -->
        <div class="text-center mb-8">
            <a href="#" class="inline-flex items-center gap-3 mb-3">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo"
                    class="w-10 h-10 object-contain rounded-lg shadow-sm pixelated" />
                <span class="font-bold text-xl text-slate-800 tracking-tight">Admin Panel Fauzan</span>
            </a>
            <h1 class="text-2xl font-bold text-slate-900 mt-2">Selamat Datang!</h1>
            <p class="text-sm text-slate-500 mt-1">Masukkan akun kamu untuk masuk ke dashboard</p>
        </div>

        <!-- +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++ -->
        <!-- Form Register -->
        <!-- +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++ -->
        <form onsubmit="handleRegister(event)" class="space-y-4">
            <div>
                <label for="fullname" class="block text-sm font-medium text-slate-700 mb-1.5">Nama</label>
                <input type="text" id="fullname" required placeholder="Nama Kamu"
                    class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:border-slate-900 transition-colors">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
                <input type="email" id="email" required placeholder="namakamu@webkamu.id"
                    class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:border-slate-900 transition-colors">
            </div>

            <!-- Password + Toggle Eye -->
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="Minimal 8 karakter"
                        class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:border-slate-900 transition-colors pr-10">
                    <button type="button" onclick="togglePass('password', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 cursor-pointer">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Konfirmasi Password + Toggle Eye -->
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-slate-700 mb-1.5">Konfirmasi Password</label>
                <div class="relative">
                    <input type="password" id="confirmPassword" required placeholder="Ulangi password kamu"
                        class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:border-slate-900 transition-colors pr-10">
                    <button type="button" onclick="togglePass('confirmPassword', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 cursor-pointer">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary w-full justify-center py-2.5 mt-2">
                Daftar Akun
            </button>
        </form>

        <!-- +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++ -->
        <!-- Footer Switcher -->
        <!-- +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++ -->
        <p class="text-center text-sm text-slate-500 mt-8">
            Sudah punya akun?
            <a href="login.html" class="font-semibold text-slate-900 hover:underline">Masuk di sini</a>
        </p>

    </div>

    <!-- ================================================================= -->
    <!-- Toast Notification Container -->
    <!-- ================================================================= -->
    <div id="toast"
        class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 ease-in-out bg-slate-900 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3">
        <span id="toastMsg" class="text-sm"></span>
    </div>

    <script src="{{ url_for('static', filename='js/Auth/register.js') }}"></script>
    <script src="{{ url_for('static', filename='js/Auth/showPw.js') }}"></script>
</body>

</html>
